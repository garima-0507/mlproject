<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student Exam Performance Prediction</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" 
          rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="/static/style.css">
</head>

<body>

<div class="container">
    <div class="card shadow mx-auto" style="max-width: 650px;">

        <h2 class="text-center mb-4">Student Exam Performance Indicator</h2>

        <form action="{{ url_for('predict_datapoint') }}" method="POST">

            <label class="form-label">Gender</label>
            <select class="form-select" name="gender" required>
                <option selected disabled value="">Select Gender</option>
                <option value="male">Male</option>
                <option value="female">Female</option>
            </select>

            <label class="form-label mt-3">Race / Ethnicity</label>
            <select class="form-select" name="ethnicity" required>
                <option selected disabled value="">Select Ethnicity</option>
                <option value="group A">Group A</option>
                <option value="group B">Group B</option>
                <option value="group C">Group C</option>
                <option value="group D">Group D</option>
                <option value="group E">Group E</option>
            </select>

            <label class="form-label mt-3">Parental Education</label>
            <select class="form-select" name="parental_level_of_education" required>
                <option selected disabled value="">Select Education</option>
                <option value="associate's degree">Associate Degree</option>
                <option value="bachelor's degree">Bachelor Degree</option>
                <option value="master's degree">Master Degree</option>
                <option value="high school">High School</option>
                <option value="some college">Some College</option>
                <option value="some high school">Some High School</option>
            </select>

            <label class="form-label mt-3">Lunch Type</label>
            <select class="form-select" name="lunch" required>
                <option selected disabled value="">Select Lunch Type</option>
                <option value="free/reduced">Free / Reduced</option>
                <option value="standard">Standard</option>
            </select>

            <label class="form-label mt-3">Test Preparation Course</label>
            <select class="form-select" name="test_preparation_course" required>
                <option selected disabled value="">Select Course</option>
                <option value="none">None</option>
                <option value="completed">Completed</option>
            </select>

            <label class="form-label mt-3">Writing Score (0–100)</label>
            <input type="number" class="form-control" name="writing_score" min="0" max="100" required>

            <label class="form-label mt-3">Reading Score (0–100)</label>
            <input type="number" class="form-control" name="reading_score" min="0" max="100" required>

            <button class="btn btn-primary mt-4 w-100" type="submit">
                Predict Maths Score
            </button>
        </form>

        {% if results %}
        <div class="alert alert-info text-center mt-4">
            <h4>Your Predicted Math Score: <strong>{{ results }}</strong></h4>
        </div>
        {% endif %}

    </div>
</div>

</body>
</html>
